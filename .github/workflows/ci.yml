# SPDX-License-Identifier: MIT
name: CI

# Runs on every pull request and on every push to main so regressions are
# caught before a release — not at tag time (see release.yml), when it is
# too late.
on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A new push cancels the run for the commit it replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No job installs packages through apt. A wedged apt on the runner held
# install steps until the six-hour limit. The runner image ships
# shellcheck, and bats installs from a github.com clone — the one host a
# runner can always reach. The timeouts bound any residual hang.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck src/*.sh bin/*.sh conditions.d/*.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        timeout-minutes: 4
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Run tests
        run: |
          # filter/integration tests create throwaway git repos
          git config --global user.email "ci@stow.sh"
          git config --global user.name "CI"
          bats --verbose-run test/
